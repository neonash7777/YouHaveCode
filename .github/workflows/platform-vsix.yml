name: Build platform VSIX

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            platform: win32
            arch: x64
          - os: ubuntu-latest
            target: linux-x64
            platform: linux
            arch: x64
          - os: macos-15-intel
            target: darwin-x64
            platform: darwin
            arch: x64
          - os: macos-15
            target: darwin-arm64
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      MINIMUM_VSCODE_VERSION: 1.134.0

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile tests
        run: npm run compile-tests

      - name: Test native integration on minimum supported VS Code
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npx vscode-test --code-version "$MINIMUM_VSCODE_VERSION" --grep "Platform native integration"
          else
            npx vscode-test --code-version "$MINIMUM_VSCODE_VERSION" --grep "Platform native integration"
          fi

      - name: Test native integration on current stable VS Code
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a npx vscode-test --code-version stable --grep "Platform native integration"
          else
            npx vscode-test --code-version stable --grep "Platform native integration"
          fi

      - name: Build and verify release inputs
        run: npm run release:prepare

      - name: Set artifact name
        shell: bash
        run: echo "VSIX=YouHaveCode-$(node -p "require('./package.json').version")-${TARGET}.vsix" >> "$GITHUB_ENV"

      - name: Package target VSIX
        shell: bash
        run: npx --yes @vscode/vsce@3.9.2 package --target "$TARGET" --out "$VSIX"

      - name: Generate checksum
        shell: bash
        run: npm run integrity:artifact -- "./$VSIX"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: YouHaveCode-${{ matrix.target }}
          path: |
            YouHaveCode-*.vsix
            YouHaveCode-*.vsix.sha256
          if-no-files-found: error